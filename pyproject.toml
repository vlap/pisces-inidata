[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pisces-inidata"
version = "1.0.0"
description = "Global Biogeochemical Initial Conditions Generator for PISCES and EC-Earth4"
readme = "README.md"
authors = [
    { name = "Vladimir Lapin", email = "volant1987@gmail.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Oceanography",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "xarray>=2022.03.0",
    "netCDF4>=1.5.8",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
copernicus = [
    "copernicusmarine>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "myst-parser>=4.0.0",
]

[project.scripts]
pisces-inidata = "pisces_inidata.cli:main"
pisces-scoreboard = "pisces_inidata.scoreboard:main"
pisces-pad-depth = "pisces_inidata.padding:main"

[project.urls]
Homepage = "https://github.com/vlap/pisces-inidata"
Documentation = "https://pisces-inidata.readthedocs.io/"
Repository = "https://github.com/vlap/pisces-inidata"
Issues = "https://github.com/vlap/pisces-inidata/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pisces_inidata*"]
