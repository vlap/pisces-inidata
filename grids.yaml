# ==============================================================================
# PISCES Target Grid Specifications & Resource Profiles (grids.yaml)
#
# Declarative specifications for target NEMO ocean curvilinear grids.
# Defines HPC resource allocations, remapping behavior, and domain file paths.
# To add a new grid (e.g. eORCA12 or regional), simply add a new section below.
# ==============================================================================

grids:
  ORCA2:
    description: "NEMO standard 2-degree tripolar grid (148x180, 31 vertical levels)"
    resources:
      time: "00:30:00"
      memory: "8G"
      cpus: 8
      batch_weights: false
    disk_space_gb: 2.0
    vertical_levels: 31
    fallback_coords_source: "official_v5.0.0/bathy.orca.nc"

  eORCA1:
    description: "Extended ORCA 1-degree global grid (362x292, 75 vertical levels)"
    resources:
      time: "01:00:00"
      memory: "16G"
      cpus: 16
      batch_weights: false
    disk_space_gb: 10.0
    vertical_levels: 75

  eORCA025:
    description: "Extended ORCA 0.25-degree eddy-permitting grid (1442x1207, 75 vertical levels)"
    resources:
      time: "02:00:00"
      memory: "64G"
      cpus: 16
      batch_weights: true
    disk_space_gb: 40.0
    vertical_levels: 75

  eORCA12:
    description: "Extended ORCA 1/12-degree eddy-resolving grid (4322x3606, 75 vertical levels)"
    resources:
      time: "04:00:00"
      memory: "128G"
      cpus: 32
      batch_weights: true
    disk_space_gb: 120.0
    vertical_levels: 75
