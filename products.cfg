# ==============================================================================
# PISCES Inidata Per-Variable Product Configuration (products.cfg)
#
# Allows setting the input observational/model product individually for each
# biogeochemical tracer and boundary forcing.
# Note: atcco2.txt is disregarded as per specification.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 3D Biogeochemical Tracers
# ------------------------------------------------------------------------------
# Nitrate (NO3):
#   Options: 'woa23' (default) | 'woa2009' | 'sette_nomask' | 'ece3'
PRODUCT_NO3="${PRODUCT_NO3:-woa23}"

# Phosphate (PO4):
#   Options: 'woa23' (default) | 'woa2009' | 'sette_nomask' | 'ece3'
PRODUCT_PO4="${PRODUCT_PO4:-woa23}"

# Silicate (Si):
#   Options: 'woa23' (default) | 'woa2009' | 'sette_nomask' | 'ece3'
PRODUCT_Si="${PRODUCT_Si:-woa23}"

# Dissolved Oxygen (O2):
#   Options: 'woa23' (default) | 'woa2009' | 'sette_nomask' | 'ece3'
PRODUCT_O2="${PRODUCT_O2:-woa23}"

# Total Alkalinity (TALK):
#   Options: 'glodap_v3' (default, 3D gridded mapped climatology) | 'glodap_v2_2016b' (official 3D gridded mapped climatology) | 'glodap_v1' | 'sette_nomask' | 'ece3'
PRODUCT_TALK="${PRODUCT_TALK:-glodap_v3}"

# Total Dissolved Inorganic Carbon (TDIC):
#   Options: 'glodap_v3' (default, 3D gridded mapped climatology) | 'glodap_v2_2016b' (official 3D gridded mapped climatology) | 'glodap_v1' | 'sette_nomask' | 'ece3'
PRODUCT_TDIC="${PRODUCT_TDIC:-glodap_v3}"

# Pre-Industrial Dissolved Inorganic Carbon (PiDIC):
#   Options: 'glodap_v3' (default, 3D gridded mapped climatology) | 'glodap_v2_2016b' (official 3D gridded mapped climatology) | 'glodap_v1' | 'sette_nomask' | 'ece3'
PRODUCT_PiDIC="${PRODUCT_PiDIC:-glodap_v3}"

# Dissolved Organic Carbon (DOC):
#   Options: 'panaiotis2024' (Panaïotis et al. 2024 ML climatology, default) | 'sette_nomask' (Hansell 2009) | 'ece3'
PRODUCT_DOC="${PRODUCT_DOC:-panaiotis2024}"

# Dissolved Iron (Fer):
#   Options: 'sette_nomask' (Tagliabue et al. 2012, default) | 'ece3'
PRODUCT_Fer="${PRODUCT_Fer:-sette_nomask}"

# ------------------------------------------------------------------------------
# 2. Surface & Boundary Forcings
# ------------------------------------------------------------------------------
# Atmospheric Dust Deposition:
#   Options: 'ece3' (INCA/Mahowald, default) | 'sette_orca2'
PRODUCT_DUST="${PRODUCT_DUST:-ece3}"

# Atmospheric Nitrogen Deposition:
#   Options: 'ece3' (Duce et al., default) | 'sette_orca2'
PRODUCT_NDEP="${PRODUCT_NDEP:-ece3}"

# Photosynthetically Available Radiation Fraction (PAR):
#   Options: 'ece3' (GEWEX 1990-2000 climatology, default) | 'sette_orca2'
PRODUCT_PAR="${PRODUCT_PAR:-ece3}"

# Bathymetric Shelf Slope Fraction:
#   Options: 'ece3' (ETOPO/pmarge, default) | 'sette_orca2'
PRODUCT_BATHY="${PRODUCT_BATHY:-ece3}"

# Hydrothermal Iron Injection:
#   Options: 'sette_orca2' (default)
PRODUCT_HYDROFE="${PRODUCT_HYDROFE:-sette_orca2}"

# River Nutrient Fluxes (Global NEWS 2):
#   Options: 'ece3' (default) | 'sette_orca2'
PRODUCT_RIVER="${PRODUCT_RIVER:-ece3}"

# Export all product choices
export PRODUCT_NO3 PRODUCT_PO4 PRODUCT_Si PRODUCT_O2
export PRODUCT_TALK PRODUCT_TDIC PRODUCT_PiDIC PRODUCT_DOC PRODUCT_Fer
export PRODUCT_DUST PRODUCT_NDEP PRODUCT_PAR PRODUCT_BATHY PRODUCT_HYDROFE PRODUCT_RIVER
