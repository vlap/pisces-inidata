# ==============================================================================
# PISCES HPC Platform Configurations (platforms.yaml)
#
# Declarative definitions for execution environments (HPC clusters, workstations).
# Select active platform via PLATFORM=<name> or PISCES_PLATFORM=<name>.
# Environment variables (e.g. SLURM_ACCOUNT, DOMAIN_BASE_DIR) override these settings.
# ==============================================================================

platforms:
  nord4:
    description: "BSC Nord4 Cluster (Intel Xeon Platinum 8480+)"
    slurm:
      account: "bsc32"
      partition: "bsc_es"
    module_load: "module load CDO NCO 2>/dev/null || true"
    scratch_root: "/gpfs/scratch/bsc32/${USER}"
    domain_dir: "/gpfs/projects/bsc32/models/ecearth/ece4-trunk/inidata/nemo/domain"

  mn5:
    description: "BSC MareNostrum 5 (GPP)"
    slurm:
      account: "bsc32"
      partition: "gpp"
    module_load: "module load cdo nco 2>/dev/null || true"
    scratch_root: "/gpfs/scratch/bsc32/${USER}"
    domain_dir: "/gpfs/projects/bsc32/models/ecearth/ece4-trunk/inidata/nemo/domain"

  generic:
    description: "Generic Linux Workstation or Cluster"
    slurm:
      account: ""
      partition: ""
    module_load: ""
    scratch_root: "${HOME}/scratch"
    domain_dir: ""
